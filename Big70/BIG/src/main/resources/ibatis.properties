##################################################################################################
# ibatis.properties
#
# Database connectivity configuration for the COINS/BIG project using iBATIS or MyBatis.
#
# This file defines standard JDBC properties for connecting to the main PostgreSQL database
# container (big_postgres) as used by the simulation back-end.
#
# Settings in this file:
#   - JDBC driver class name (PostgreSQL)
#   - JDBC connection URL
#   - Database username
#   - Database password
#
# Adjust values as required for your environment. See also:
#   - application.properties (Spring Boot primary configuration)
#   - application-local.properties (local/development overrides)
##################################################################################################



driver=org.postgresql.Driver
url=jdbc:postgresql://big_postgres:5432/bigdb
username=biguser
password=bigpass