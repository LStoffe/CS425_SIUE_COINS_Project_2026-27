##################################################################################################
# application-local.properties
#
# Local development Spring Boot configuration for the COINS/BIG app.
#
# This profile is intended for running the application locally, connecting to the Dockerized
# PostgreSQL database instance. Use when developing or testing features on your workstation,
# not for production deployments.
#
# Usage:
#   - Start the DB container:   docker-compose up -d db
#   - Run the app with profile: mvn spring-boot:run -Dspring-boot.run.profiles=local
#   - Or set environment var:   SPRING_PROFILES_ACTIVE=local
#
# These settings override defaults in application.properties as needed for local workflow.
##################################################################################################

spring.datasource.url=jdbc:postgresql://localhost:5432/bigdb
spring.datasource.username=biguser
spring.datasource.password=bigpass
