<!--
  view-companies.html
  Allows admins to view current companies (users) registered into this specific instance of the game.
-->

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>COINS - Companies</title>
  <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>

<body class="bg-white text-black font-sans min-h-screen flex flex-col">

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar-admin :: navbar}"></div>

  <!-- Header -->
  <header class="text-center py-8">
    <h1 class="text-6xl font-bold mb-4">COINS</h1>
    <h2 class="text-3xl mb-2">Companies in this Game</h2>
  </header>

  <!-- Main Content -->
  <main class="flex justify-center px-6 pb-20">
    <div class="bg-white p-10 rounded-2xl shadow-lg w-full max-w-7xl">

      <div class="flex justify-between items-center mb-6">
        <h3 class="text-2xl font-bold">Company List</h3>
        <a th:href="@{/admin/add-new-company}"
           class="px-4 py-2 rounded-lg bg-amber-500 hover:bg-amber-600 font-semibold transition">
          Add New Company
        </a>
      </div>

      <!-- Scrollable Table Container -->
      <div class="overflow-x-auto border border-gray-300 rounded-lg">
        <table class="w-full text-sm">
          <thead class="bg-gray-100 border-b border-gray-300">
            <tr>
              <th class="px-4 py-3 text-left font-semibold">Company</th>
              <th class="px-4 py-3 text-left font-semibold">Username</th>
              <th class="px-4 py-3 text-right font-semibold">Cash on Hand</th>
              <th class="px-4 py-3 text-right font-semibold">WIP</th>
              <th class="px-4 py-3 text-right font-semibold">WIP Bond Limit</th>
              <th class="px-4 py-3 text-right font-semibold">Per Job Limit</th>
              <th class="px-4 py-3 text-center font-semibold">Jobs Won</th>
              <th class="px-4 py-3 text-center font-semibold">Jobs Completed</th>
              <th class="px-4 py-3 text-center font-semibold">Total Bids</th>
              <th class="px-4 py-3 text-center font-semibold">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="company : ${companies}" class="border-b hover:bg-gray-50">
              <td class="px-4 py-3 font-semibold" th:text="${company.title}">Company</td>
              <td class="px-4 py-3" th:text="${company.username}">Username</td>
              <td class="px-4 py-3 text-right"
                  th:text="'$' + ${#numbers.formatDecimal(company['cash_on_hand'], 1, 'COMMA', 2, 'POINT')}">$0</td>
              <td class="px-4 py-3 text-right"
                  th:text="'$' + ${#numbers.formatDecimal(company.wip, 1, 'COMMA', 2, 'POINT')}">$0</td>
              <td class="px-4 py-3 text-right"
                  th:text="'$' + ${#numbers.formatDecimal(company['wip_limit'], 1, 'COMMA', 2, 'POINT')}">$0</td>
              <td class="px-4 py-3 text-right"
                  th:text="'$' + ${#numbers.formatDecimal(company['per_job_limit'], 1, 'COMMA', 2, 'POINT')}">$0</td>
              <td class="px-4 py-3 text-center" th:text="${company.jobsWon}">0</td>
              <td class="px-4 py-3 text-center" th:text="${company.jobsCompleted}">0</td>
              <td class="px-4 py-3 text-center" th:text="${company.totalBids}">0</td>
              <td class="px-4 py-3 text-center">
                <form th:action="@{/admin/delete-company}" method="post" style="display:inline;">
                  <input type="hidden" name="companyId" th:value="${company.companyid}">
                  <button type="submit" class="text-red-600 hover:underline font-semibold">
                    Remove
                  </button>
                </form>
              </td>
            </tr>

            <!-- Empty state -->
            <tr th:if="${#lists.isEmpty(companies)}">
              <td colspan="10" class="px-4 py-8 text-center text-gray-500">
                No companies added yet. Click "Add New Company" to get started.
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Back Button -->
      <div class="mt-8 text-center">
        <a th:href="@{/admin/recall-menu}"
           class="px-6 py-2 rounded-lg border border-gray-400 hover:bg-gray-100 transition inline-block">
          Back to Game Menu
        </a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
