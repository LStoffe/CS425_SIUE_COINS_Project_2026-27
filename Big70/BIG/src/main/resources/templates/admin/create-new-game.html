<!--
  create-new-game.html
  Allows admins to create a new game simulation of COINS
-->

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>COINS - Create New Game</title>
  <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>

<body class="bg-white text-black font-sans min-h-screen flex flex-col">

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar-admin :: navbar}"></div>

  <!-- Header -->
  <header class="text-center py-8">
    <h1 class="text-6xl font-bold mb-4">COINS</h1>
    <h2 class="text-3xl mb-2">Create a New Game</h2>
  </header>

  <!-- Main Content -->
  <main class="flex items-center justify-center px-6 pb-20">
    <div class="bg-white p-10 rounded-2xl shadow-lg w-full max-w-lg">

      <h3 class="text-2xl font-bold mb-6 text-center">
        Game Details
      </h3>

      <form th:action="@{/admin/create-new-game}" method="post" class="space-y-6">

   
        <div th:if="${error}" class="bg-red-100 text-red-700 border border-red-400 rounded-lg px-4 py-2">
          <p th:text="${error}"></p>
        </div>

        <!-- Game Name -->
        <div>
          <label for="gameName" class="block font-semibold mb-1">
            Game Name
          </label>
          <input
            type="text"
            id="gameName"
            name="gameName"
            maxlength="20"
            required
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500"
          >
        </div>

        <!-- Start Year -->
        <div>
          <label for="startYear" class="block font-semibold mb-1">
            Start Year
          </label>
          <input
            type="number"
            id="startYear"
            name="startYear"
            min="1900"
            max="2100"
            required
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500"
          >
        </div>

        <!-- Game Type -->
        <div>
          <p class="font-semibold mb-2">
            Game Type
          </p>

          <div class="flex items-center space-x-2 mb-2">
            <input
              type="checkbox"
              id="building"
              name="building"
              class="h-4 w-4 text-amber-500 focus:ring-amber-500"
            >
            <label for="building">
              Building Construction Game
            </label>
          </div>

          <div class="flex items-center space-x-2">
            <input
              type="checkbox"
              id="heavy"
              name="heavy"
              class="h-4 w-4 text-amber-500 focus:ring-amber-500"
            >
            <label for="heavy">
              Heavy Construction Game
            </label>
          </div>
        </div>

        <!-- Actions -->
        <div class="flex justify-between pt-4">

          <a th:href="@{/admin/admin-menu}"
             class="px-4 py-2 rounded-lg border border-gray-400 hover:bg-gray-100 transition">
            Cancel
          </a>

          <div class="space-x-2">
            <button
              type="reset"
              class="px-4 py-2 rounded-lg border border-gray-400 hover:bg-gray-100 transition">
              Reset
            </button>

            <button
              type="submit"
              class="px-6 py-2 rounded-lg bg-amber-500 hover:bg-amber-600 font-semibold transition">
              Create Game
            </button>
          </div>

        </div>

      </form>
    </div>
  </main>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
