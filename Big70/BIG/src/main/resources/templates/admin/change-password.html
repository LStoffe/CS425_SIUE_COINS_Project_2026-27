<!--
  change-password.html
  Allows admins to change their password securely
-->

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>COINS - Change Password</title>
  <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>

<body class="bg-white text-black font-sans min-h-screen flex flex-col">

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar-admin :: navbar}"></div>

  <!-- Header -->
  <header class="text-center py-8">
    <h1 class="text-6xl font-bold mb-4">COINS</h1>
    <h2 class="text-3xl mb-2">Change Password</h2>
  </header>

  <!-- Main Content -->
  <main class="flex items-center justify-center px-6 pb-20">
    <div class="bg-white p-10 rounded-2xl shadow-lg w-full max-w-md">

      <h3 class="text-2xl font-bold mb-6 text-center">
        Update Your Password
      </h3>

      <form th:action="@{/admin/change-password}" method="post" class="space-y-6">

        <div th:if="${error}" class="bg-red-100 text-red-700 border border-red-400 rounded-lg px-4 py-2">
          <p th:text="${error}"></p>
        </div>
        <div th:if="${success}" class="bg-green-100 text-green-700 border border-green-400 rounded-lg px-4 py-2">
          <p th:text="${success}"></p>
        </div>
      

        <!-- Current Password -->
        <div>
          <label for="oldPassword" class="block font-semibold mb-1">
            Current Password
          </label>
          <input
            type="password"
            id="oldPassword"
            name="oldPassword"
            required
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500"
          >
        </div>

        <!-- New Password -->
        <div>
          <label for="newPassword" class="block font-semibold mb-1">
            New Password
          </label>
          <input
            type="password"
            id="newPassword"
            name="newPassword"
            required
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500"
          >
        </div>

        <!-- Confirm New Password -->
        <div>
          <label for="confirmPassword" class="block font-semibold mb-1">
            Confirm New Password
          </label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            required
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500"
          >
        </div>

        <!-- Actions -->
        <div class="flex justify-between pt-4">

          <a th:href="@{/admin/admin-menu}"
              class="px-4 py-2 rounded-lg border border-gray-400 hover:bg-gray-100 transition">
              Back
          </a>

          <div class="space-x-2">
            <button
              type="reset"
              class="px-4 py-2 rounded-lg border border-gray-400 hover:bg-gray-100 transition">
              Reset
            </button>

            <button
              type="submit"
              class="px-6 py-2 rounded-lg bg-amber-500 hover:bg-amber-600 font-semibold transition">
              Change Password
            </button>
          </div>

        </div>

      </form>
    </div>
  </main>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
