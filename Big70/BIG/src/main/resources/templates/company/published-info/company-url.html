<!--
    company-url.html
    This page allows the company to change their Company URL displayed in the company menu.
-->


<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>COINS - Edit Company URL</title>
  <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>

<body class="bg-white text-black font-sans min-h-screen flex flex-col">

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar-company :: navbar}"></div>

  <!-- Header -->
  <header class="text-center py-8">
    <h1 class="text-6xl font-bold mb-4">COINS</h1>
    <h2 class="text-3xl mb-2">Edit Company URL</h2>
  </header>

  <!-- Main Content -->
  <main class="flex items-center justify-center px-6 pb-20">
    <div class="bg-white p-10 rounded-2xl shadow-lg w-full max-w-3xl">

      <h3 class="text-2xl font-bold mb-6 text-center">
        Company URL Edit Window
      </h3>

      <form name="companyURLForm" method="post" action="#" class="space-y-6">

        <!-- Textarea -->
        <div>
          <label for="companyURL" class="block font-semibold mb-2">
            Type Your Text Here - Be sure to include "http://" at the beginning of your URL
          </label>
          <form name="companyURLForm" method="post" th:action="@{/company/published-info/company-url}" class="space-y-6">
            <textarea id="companyUrl" name="companyUrl" rows="12"
              th:text="${companyUrl}"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500 font-sans resize-y">
            </textarea>
        </div>

        <!-- Actions -->
        <div class="flex justify-between pt-4">
            <a th:href="@{/company/published-info-menu}"
                class="px-4 py-2 rounded-lg border border-gray-400 hover:bg-gray-100 transition inline-block">
            Cancel
            </a>

            <button
                type="submit"
                class="px-6 py-2 rounded-lg bg-amber-500 hover:bg-amber-600 font-semibold transition">
                Submit
            </button>
        </div>

      </form>

    </div>
  </main>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
