<!--
    schedule-estimates.html
    This page displays the estimated schedules associated with company bids.
-->

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>COINS - Choose Job for Schedule Estimate</title>
  <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>

<body class="bg-white text-black font-sans min-h-screen flex flex-col">

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar-company :: navbar}"></div>

  <!-- Header -->
  <header class="text-center py-8">
    <h1 class="text-6xl font-bold mb-4">COINS</h1>
    <h2 class="text-3xl mb-2">Choose Job for Schedule Estimate</h2>
  </header>

  <!-- Main Content -->
  <main class="flex justify-center px-6 pb-20">
    <div class="bg-white p-10 rounded-2xl shadow-lg w-full max-w-3xl">

      <h3 class="text-xl font-bold mb-6">
        Choose Job for Estimate
      </h3>

      <!-- Not Available Message -->
      <div class="text-center py-16">
        <div class="inline-block p-6 bg-gray-50 rounded-full mb-4">
          <svg class="w-16 h-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path>
          </svg>
        </div>
        <p class="text-lg text-gray-600">Not available in this game.</p>
      </div>

      <!-- Back Button -->
      <div class="mt-10 text-center">
        <a th:href="@{/company/bidding-menu}"
           class="inline-block bg-amber-500 hover:bg-amber-600 text-black font-semibold py-2 px-6 rounded-lg transition-colors">
          Back to Bidding Menu
        </a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
