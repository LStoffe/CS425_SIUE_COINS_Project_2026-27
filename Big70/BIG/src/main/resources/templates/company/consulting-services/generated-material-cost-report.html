<!--
  generated-material-cost-report.html
  This page displays the Material Cost Index Report for a company as part of its consulting services in COINS.
-->

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>COINS - Material Cost Index Report</title>
  <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>

<body class="bg-white text-black font-sans min-h-screen flex flex-col">

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar-company :: navbar}"></div>

  <!-- Header -->
  <header class="text-center py-8">
    <h1 class="text-6xl font-bold mb-4">COINS</h1>
    <h2 class="text-3xl mb-2">Material Cost Index Report</h2>
  </header>

  <!-- Main Content -->
  <main class="flex justify-center px-6 pb-20">
    <div class="bg-white p-10 rounded-2xl shadow-lg w-full max-w-4xl">

      <!-- Report Card -->
      <div class="space-y-4 text-lg">

        <div>
          <span class="font-semibold">Company:</span>
          <span th:text="${username}">Company Name</span>
        </div>

        <div>
          <span class="font-semibold">Report Date:</span>
          <span th:text="${periodDate}">Period</span>
        </div>

        <div>
          <span class="font-semibold">Report Cost:</span>
          <span>$500</span>
        </div>

        <div class="pt-6 border-t border-gray-300">
          <h4 class="font-bold text-xl mb-4">Materials Cost Index — Next 3 Periods</h4>
          <div th:each="period : ${forecast}" class="mb-4 p-4 bg-gray-50 rounded-lg border border-gray-200">
            <p class="font-semibold mb-2">Period <span th:text="${period.period}">0</span></p>
            <p>
              <span class="font-medium">Materials Cost Index:</span>
              <span th:text="${period.index}">100</span>%
            </p>
          </div>
        </div>

      </div>

      <!-- Action Button -->
      <div class="mt-10 text-center">
        <a th:href="@{/company/consulting-services-menu}"
            class="inline-block bg-amber-500 hover:bg-amber-600 text-black font-semibold py-2 px-6 rounded-lg transition-colors">
          Back to Consulting Services Menu
        </a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
