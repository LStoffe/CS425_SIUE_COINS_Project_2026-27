<!--
  manage-personnel.html
  This page allows a company to manage personnel as part of its financial services.
-->

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>COINS - Employee List</title>
  <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>

<body class="bg-white text-black font-sans min-h-screen flex flex-col">

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar-company :: navbar}"></div>

  <!-- Header -->
  <header class="text-center py-8">
    <h1 class="text-6xl font-bold mb-4">COINS</h1>
    <h2 class="text-3xl mb-2">Employee List</h2>
  </header>

  <!-- Main Content -->
  <main class="flex justify-center px-6 pb-20">
    <div class="bg-white p-10 rounded-2xl shadow-lg w-full max-w-7xl">

      <h3 class="text-2xl font-bold mb-6 text-center">Current Employee Roster</h3>

      <form method="post" th:action="@{/company/financial-services/manage-personnel}">

        <div class="overflow-x-auto border border-gray-300 rounded-lg">

          <!-- Success Message -->
          <div th:if="${param.success}" class="mb-6 bg-green-100 text-green-700 border border-green-400 rounded-lg px-4 py-2">
            <p>Personnel changes submitted successfully!</p>
          </div>

          <!-- Error Message -->
          <div th:if="${error}" class="mb-6 bg-red-100 text-red-700 border border-red-400 rounded-lg px-4 py-2">
            <p th:text="${error}"></p>
          </div>

          <table class="w-full text-sm">
            <thead class="bg-gray-100 border-b border-gray-300">
              <tr>
                <th class="px-4 py-3 text-left font-semibold">Employee Type</th>
                <th class="px-4 py-3 text-right font-semibold">Pay per Period</th>
                <th class="px-4 py-3 text-center font-semibold"># Currently Employed</th>
                <th class="px-4 py-3 text-right font-semibold">Total Cost</th>
                <th class="px-4 py-3 text-center font-semibold">Hire / Layoff</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="p : ${personnel}" 
                  th:classappend="${pStat.odd} ? 'bg-gray-50' : ''"
                  class="border-b hover:bg-gray-50">
                <td class="px-4 py-2">
                  <span class="font-medium" th:text="${p['employee_title']}">Employee</span>
                </td>
                <td class="px-4 py-2 text-right" 
                    th:text="'$' + ${#numbers.formatDecimal(p['employee_cost_per_period'], 1, 'COMMA', 0, 'POINT')}">$0</td>
                <td class="px-4 py-2 text-center" th:text="${p['current_count']}">0</td>
                <td class="px-4 py-2 text-right"
                    th:text="'$' + ${#numbers.formatDecimal(p['current_count'] * p['employee_cost_per_period'], 1, 'COMMA', 0, 'POINT')}">$0</td>
                <td class="px-4 py-2">
                  <div class="flex items-center justify-center space-x-2">
                    <button type="button" onclick="adjustCount(this, -1)"
                      class="w-7 h-7 rounded-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold text-lg leading-none transition">−</button>
                    <input type="number" 
                           th:name="'hire_' + ${p['employee_title'].replace(' ', '_')}"
                           value="0" min="-99" max="99"
                           class="w-16 text-center border border-gray-300 rounded-lg px-1 py-1 focus:outline-none focus:ring-2 focus:ring-amber-500">
                    <button type="button" onclick="adjustCount(this, 1)"
                      class="w-7 h-7 rounded-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold text-lg leading-none transition">+</button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Form Actions -->
        <div class="flex justify-between mt-8">
          <a th:href="@{/company/financial-services-menu}" 
             class="px-6 py-2 rounded-lg border border-gray-400 hover:bg-gray-100 transition inline-block">
            Cancel
          </a>
          <div class="space-x-3">
            <button type="button" onclick="resetAll()"
              class="px-6 py-2 rounded-lg border border-gray-400 hover:bg-gray-100 transition">
              Reset
            </button>
            <button type="submit"
              class="px-6 py-2 rounded-lg bg-amber-500 hover:bg-amber-600 font-semibold transition">
              Submit Changes
            </button>
          </div>
        </div>

      </form>
    </div>
  </main>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

  <script>
    function adjustCount(btn, delta) {
      const input = btn.parentElement.querySelector('input[type="number"]');
      input.value = parseInt(input.value || 0) + delta;
    }

    function resetAll() {
      document.querySelectorAll('input[type="number"]').forEach(input => input.value = 0);
    }
  </script>

</body>
</html>
