<!--
  view-personnel-report.html
  This page displays the company's personnel report as part of its financial services.
-->


<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>COINS - Personnel Report</title>
  <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>

<body class="bg-white text-black font-sans min-h-screen flex flex-col">

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar-company :: navbar}"></div>

  <!-- Header -->
  <header class="text-center py-8">
    <h1 class="text-6xl font-bold mb-4">COINS</h1>
    <h2 class="text-3xl mb-2">Personnel Report</h2>
  </header>

  <!-- Main Content -->
  <main class="flex justify-center px-6 pb-20">
    <div class="bg-white p-10 rounded-2xl shadow-lg w-full max-w-4xl">

      <!-- Report Header -->
      <div class="text-center mb-8">
        <h3 class="text-2xl font-bold mb-2" th:text="${username}">Company Name</h3>
        <h4 class="text-xl font-semibold mb-2">Personnel Report</h4>
        <p class="text-sm text-gray-600" th:text="'Period: ' + ${currentPeriod} + ', ' + ${periodDate}">Period</p>
      </div>

      <!-- Report Content -->
      <div th:if="${!#lists.isEmpty(report)}">
        <div class="overflow-x-auto border border-gray-300 rounded-lg mb-6">
          <table class="w-full text-sm">
            <thead class="bg-gray-100 border-b border-gray-300">
              <tr>
                <th class="px-4 py-3 text-left font-semibold">Employee Type</th>
                <th class="px-4 py-3 text-center font-semibold">Count</th>
                <th class="px-4 py-3 text-right font-semibold">Cost Per Period</th>
                <th class="px-4 py-3 text-right font-semibold">Total Cost</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="p : ${report}" class="border-b hover:bg-gray-50">
                <td class="px-4 py-3" th:text="${p['employee_title']}">Title</td>
                <td class="px-4 py-3 text-center" th:text="${p['employee_type_count']}">0</td>
                <td class="px-4 py-3 text-right"
                    th:text="'$' + ${#numbers.formatDecimal(p['employee_cost_per_period'], 1, 'COMMA', 0, 'POINT')}">$0</td>
                <td class="px-4 py-3 text-right"
                    th:text="'$' + ${#numbers.formatDecimal(p['total_cost'], 1, 'COMMA', 0, 'POINT')}">$0</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div th:if="${#lists.isEmpty(report)}" 
          class="mb-8 p-6 bg-gray-50 border border-gray-200 rounded-lg text-center">
        <p class="text-lg text-gray-800 font-medium">No personnel hired yet.</p>
      </div>
      
      <!-- Back Button -->
      <div class="mt-8 text-center">
        <a th:href="@{/company/financial-services-menu}" 
        class="inline-block bg-amber-500 hover:bg-amber-600 text-black font-semibold py-2 px-6 rounded-lg transition-colors">
          Back to Financial Services
        </a>
      </div>


    </div>
  </main>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
