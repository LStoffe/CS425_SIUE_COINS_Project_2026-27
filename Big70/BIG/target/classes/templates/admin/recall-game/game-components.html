<!--
  game-components.html
  Allows admins to change game components of this specific game.
-->


<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>COINS - Game Components</title>
  <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>

<body class="bg-white text-black font-sans min-h-screen flex flex-col">

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar-admin :: navbar}"></div>

  <!-- Header -->
  <header class="text-center py-8">
    <h1 class="text-6xl font-bold mb-4">COINS</h1>
    <h2 class="text-3xl mb-2">Game Components</h2>
  </header>

  <!-- Main Content -->
  <main class="flex items-center justify-center px-6 pb-20">
    <div class="bg-white p-10 rounded-2xl shadow-lg w-full max-w-2xl">

      <h3 class="text-2xl font-bold mb-6 text-center">
        Component Settings
      </h3>

      <!-- Component Toggles -->
    <div class="space-y-6 mb-8">

        <!-- Estimating Component -->
        <div class="p-6 border border-gray-300 rounded-lg">
        <div class="flex justify-between items-start mb-3">
            <div>
            <h4 class="font-bold text-lg mb-2">Estimating Component</h4>
            <p class="text-gray-700">
                Status: <span class="font-semibold">Off</span>
            </p>
            <p class="text-sm text-gray-600 mt-1">
                COINS will <span class="font-semibold">not</span> provide companies with estimates.
            </p>
            </div>
        </div>
        <div class="flex justify-end">
            <a href="#" 
            class="px-6 py-2 rounded-lg bg-amber-500 hover:bg-amber-600 font-semibold transition">
            Turn On
            </a>
        </div>
        </div>
    
        <!-- Automatic Billing Component -->
        <div class="p-6 border border-gray-300 rounded-lg">
        <div class="flex justify-between items-start mb-3">
            <div>
            <h4 class="font-bold text-lg mb-2">Automatic Billing Component</h4>
            <p class="text-gray-700">
                Status: <span class="font-semibold">Off</span>
            </p>
            <p class="text-sm text-gray-600 mt-1">
                COINS will <span class="font-semibold">not</span> perform automatic billing.
            </p>
            </div>
        </div>
        <div class="flex justify-end">
            <a href="#" 
            class="px-6 py-2 rounded-lg bg-amber-500 hover:bg-amber-600 font-semibold transition">
            Turn On
            </a>
        </div>
        </div>
    
    </div>
    
    <!-- Back Button -->
    <div class="text-center">
        <a th:href="@{/admin/recall-menu}" 
        class="px-6 py-2 rounded-lg border border-gray-400 hover:bg-gray-100 transition inline-block">
        Back to Game Menu
        </a>
    </div>

    </div>
  </main>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
