<!--
  period-reports.html
  This page shows Admins the reports for estimated time and costs of jobs during a specific period.
-->

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>COINS - Period Reports</title>
  <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>

<body class="bg-white text-black font-sans min-h-screen flex flex-col">

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar-admin :: navbar}"></div>

  <!-- Header -->
  <header class="text-center py-8">
    <h1 class="text-6xl font-bold mb-4">COINS</h1>
    <h2 class="text-3xl mb-2">Period Reports</h2>
  </header>

  <!-- Main Content -->
  <main class="flex justify-center px-6 pb-20">
    <div class="bg-white p-10 rounded-2xl shadow-lg w-full max-w-4xl">

      <!-- Period Selector -->
      <div class="mb-8 pb-6 border-b border-gray-200">
        <h3 class="text-lg font-semibold mb-3">Select Period:</h3>
        <div class="flex gap-2">
          <span class="px-4 py-2 bg-amber-500 text-black font-semibold rounded-lg">1</span>
        </div>
      </div>

      <!-- Report Header -->
      <div class="mb-8">
        <h3 class="text-xl font-bold mb-2">Report Date: PERIOD DATE</h3>
        <p class="text-gray-700 font-semibold">Period: 1</p>
      </div>

      <!-- Report Links Section -->
      <div class="space-y-6">

        <!-- Productivity Report -->
        <div class="p-4 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
          <a href="#" class="text-amber-600 hover:text-amber-700 font-semibold text-lg">
            Productivity Report
          </a>
        </div>

        <!-- Complete List of Bids -->
        <div class="p-4 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
          <a href="#" class="text-amber-600 hover:text-amber-700 font-semibold text-lg">
            View Complete List of Bids Report
          </a>
        </div>

        <!-- Estimated Time and Cost Reports -->
        <div class="p-6 border border-gray-300 rounded-lg">
          <h4 class="font-bold text-lg mb-4">Estimated Time and Cost Reports for Jobs Created this Period</h4>
          
          <!-- Empty State -->
          <div class="text-center py-8 text-gray-500">
            No jobs created this period yet.
          </div>

          <!-- When you have jobs, they'll appear here: -->

        </div>

      <!-- Back Button -->
    <div class="text-center">
        <a th:href="@{/admin/recall-menu}" 
        class="px-6 py-2 rounded-lg border border-gray-400 hover:bg-gray-100 transition inline-block">
        Back to Game Menu
        </a>
    </div>

    </div>
  </main>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
