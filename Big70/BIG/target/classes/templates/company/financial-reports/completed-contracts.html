<!--
    completed-contracts.html
    Allows users to see their completed contracts for each period
-->


<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>COINS - Completed Contracts Report</title>
  <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>

<body class="bg-white text-black font-sans min-h-screen flex flex-col">

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar-company :: navbar}"></div>

  <!-- Header -->
  <header class="text-center py-8">
    <h1 class="text-6xl font-bold mb-4">COINS</h1>
    <h2 class="text-3xl mb-2">Completed Contracts Report</h2>
  </header>

  <!-- Main Content -->
  <main class="flex justify-center px-6 pb-20">
    <div class="bg-white p-10 rounded-2xl shadow-lg w-full max-w-4xl">

      <!-- Period Selector -->
      <div class="mb-6">
        <p class="text-gray-700">
          <span class="font-semibold">View Report for Period:</span> 1
        </p>
      </div>

      <hr class="mb-8 border-gray-300">

      <!-- Report Header -->
      <div class="text-center mb-8">
        <h3 class="text-2xl font-bold mb-2">J's Testing Company</h3>
        <h4 class="text-xl font-semibold mb-2">Completed Contracts Report</h4>
        <p class="text-sm text-gray-600">Period: 1, January & February 1999</p>
      </div>

       <!-- Report Content -->
       <div class="mb-8 p-6 bg-gray-50 border border-gray-200 rounded-lg">
        <p class="text-lg text-gray-800 font-medium text-center">
          There are no completed jobs.
        </p>
      </div>

    <!-- Back Button -->
    <div class="mt-10 text-center">
      <a th:href="@{/company/financial-reports-menu}"
         class="inline-block bg-amber-500 hover:bg-amber-600 text-black font-semibold py-2 px-6 rounded-lg transition-colors">
        Back to Financial Reports
      </a>
    </div>

    </div>
  </main>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
