<!--
  generated-labor-report.html
  This page displays the Labor Availability Index Report for a company as part of its consulting services in COINS.
-->


<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>COINS - Labor Availability Report</title>
  <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>

<body class="bg-white text-black font-sans min-h-screen flex flex-col">

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar-company :: navbar}"></div>

  <!-- Header -->
  <header class="text-center py-8">
    <h1 class="text-6xl font-bold mb-4">COINS</h1>
    <h2 class="text-3xl mb-2">Labor Availability Index Report</h2>
  </header>

  <!-- Main Content -->
  <main class="flex justify-center px-6 pb-20">
    <div class="bg-white p-10 rounded-2xl shadow-lg w-full max-w-4xl">

      <!-- Report Card -->
      <div class="space-y-4 text-lg">

        <div>
          <span class="font-semibold">Company:</span>
          <span>Company Name</span>
        </div>

        <div>
          <span class="font-semibold">Period:</span>
          <span>3 - May & June 2026</span>
        </div>

        <div>
          <span class="font-semibold">Report Cost:</span>
          <span>$500</span>
        </div>

        <div class="pt-6 border-t border-gray-300">
          <span class="font-semibold">Labor Availability Status:</span>
          <span class="rounded-full">
            Unsatisfactory
          </span>
        </div>

      </div>

      <!-- Action Button -->
      <div class="mt-10 text-center">
        <a th:href="@{/company/consulting-services-menu}"
            class="inline-block bg-amber-500 hover:bg-amber-600 text-black font-semibold py-2 px-6 rounded-lg transition-colors">
          Back to Consulting Services Menu
        </a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
