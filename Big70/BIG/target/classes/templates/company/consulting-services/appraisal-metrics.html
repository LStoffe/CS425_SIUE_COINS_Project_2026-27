<!--
    appraisal-metrics.html
    This page displays the Appraisal Metrics consulting service report.
-->


<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>COINS - Company Appraisal Metrics</title>
  <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>

<body class="bg-white text-black font-sans min-h-screen flex flex-col">

  <!-- Navbar -->
  <div th:replace="~{fragments/navbar-company :: navbar}"></div>

  <!-- Header -->
  <header class="text-center py-8">
    <h1 class="text-6xl font-bold mb-4">COINS</h1>
    <h2 class="text-3xl mb-2">Company Appraisal Metrics</h2>
  </header>

  <!-- Main Content -->
  <main class="flex items-center justify-center px-6 pb-20">
    <div class="bg-white p-10 rounded-2xl shadow-lg w-full max-w-2xl">

      <h3 class="text-2xl font-bold mb-6 text-center">
        Confirmation Required
      </h3>

      <!-- Report Info -->
      <div class="mb-8 p-6 bg-gray-50 border border-gray-200 rounded-lg">
        <div class="flex items-start">
          <div>
            <p class="text-gray-800 mb-3">
              You have not yet purchased the <span class="font-bold">Company Appraisal Metrics</span> for period 1.
            </p>
            <p class="text-lg font-semibold text-gray-900">
              This report will cost <span class="text-gray-700">$500</span>
            </p>
          </div>
        </div>
      </div>

      <!-- Question -->
      <div class="mb-8">
        <p class="text-xl font-semibold text-gray-900 text-center">
          Do you wish to view this report?
        </p>
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-center space-x-4">
        <a th:href="@{/company/consulting-services/generated-appraisal-metrics-report}"
           class="px-8 py-3 rounded-lg bg-amber-500 hover:bg-amber-600 font-semibold text-lg transition">
          Yes
        </a>

        <a th:href="@{/company/consulting-services-menu}"
           class="px-8 py-3 rounded-lg border border-gray-400 hover:bg-gray-100 font-semibold text-lg transition">
          No
        </a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
